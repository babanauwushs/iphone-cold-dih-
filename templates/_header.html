<header class="header" id="top">
    <a class="logo-area" href="{{ url_for('index') }}" aria-label="Нүүр хуудас">
        <img class="logo-image" src="{{ url_for('static', filename='ikh-zasag-logo.webp') }}" alt="Их Засаг Олон Улсын Их Сургуулийн лого">
        <span>
            <h1>Мэргэжлийн сургалт</h1>
            <p>МЭДЛЭГ · УР ЧАДВАР · ИРЭЭДҮЙ</p>
        </span>
    </a>
    <nav class="site-nav" aria-label="Үндсэн цэс">
        <a class="nav-link" href="{{ url_for('index', _anchor='top') }}">Нүүр</a>
        <a class="nav-link" href="{{ url_for('index', _anchor='about') }}">Бидний тухай</a>
        <a class="nav-link" href="{{ url_for('news.list_news') }}">Мэдээ, зарлал</a>

        <div class="nav-dropdown">
            <a class="nav-link nav-trigger" href="{{ url_for('index', _anchor='programs') }}">
                Мэргэжил
                <span class="nav-caret" aria-hidden="true">▾</span>
            </a>
            <div class="nav-menu" aria-label="Мэргэжлийн сонголтууд">
                {% for slug, program in programs.items() %}
                <a href="#program-{{ slug }}">{{ program.name }}</a>
                {% endfor %}
            </div>
        </div>

        {% if current_user %}
        <a class="nav-link" href="{{ url_for('index', _anchor='students') }}">Суралцагчийн хэсэг</a>
        <span class="user-greeting">{{ current_user.username }}</span>
        <form class="logout-form" action="{{ url_for('logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="nav-button" type="submit">Гарах</button>
        </form>
        {% else %}
        <a class="nav-button" href="{{ url_for('index', _anchor='login') }}">Нэвтрэх</a>
        <a class="nav-register" href="{{ url_for('index', _anchor='register') }}">Бүртгүүлэх</a>
        {% endif %}
        <a class="nav-button nav-admin"
           href="{% if current_user and current_user.role == 'admin' %}{{ url_for('admin') }}{% else %}{{ url_for('admin_login') }}{% endif %}">
            Админ самбар
        </a>
    </nav>
</header>
